name: Debug Windows test classes

"on":
  workflow_dispatch:

jobs:
  debug-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: false
      - name: Check out the Speex submodules
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git submodule update --init --recursive
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: Install MinGW
        shell: pwsh
        run: |
          choco install mingw -y --no-progress
          echo "C:\ProgramData\chocolatey\lib\mingw\tools\install\bin" |
            Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Run each test class in its own JVM
        shell: pwsh
        run: |
          foreach ($class in @("cn.enaium.speex.SpeexDspTest", "cn.enaium.speex.SpeexTest")) {
            Write-Host "=== $class ==="
            ./gradlew --no-daemon --stacktrace :speex-kmp:jvmTest --tests $class
            Write-Host "EXIT $class = $LASTEXITCODE"
          }
